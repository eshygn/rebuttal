# Render Blueprint: one free web service. SQLite lives on the instance's ephemeral disk
# and is re-seeded with the demo scenario on boot, which is what a demo wants.
services:
  - type: web
    name: rebuttal
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Optional. Leave unset to run fully in mock mode.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: SANDBOX_INR_TRANSACTION_ID
        sync: false
      - key: SANDBOX_SNAD_TRANSACTION_ID
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
